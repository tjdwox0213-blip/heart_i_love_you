<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>I LOVE YOU Heart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}




#floating-hearts{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}


.bg-heart{

    position:absolute;

    bottom:-50px;

    color:#ff69b4;

    opacity:0.35;

    animation:floatUp linear infinite;

}



@keyframes floatUp{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }


    20%{
        opacity:0.5;
    }


    100%{

        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;

    }

}





#heart{

    position:relative;

    width:700px;

    height:650px;

    z-index:1;

}



.word{

    position:absolute;

    color:#ff69b4;


    font-family:"Raleway", sans-serif;

    font-size:14px;

    font-weight:500;

    letter-spacing:1px;


    white-space:nowrap;


    opacity:0;


    animation:appear .25s forwards;

}



@keyframes appear{

    from{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(.5);

    }


    to{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(1);

    }

}


</style>

</head>


<body>



<div id="floating-hearts"></div>



<div id="heart"></div>



<script>





const floating =
document.getElementById("floating-hearts");



function createHeart(){


    const heart =
    document.createElement("div");


    heart.className="bg-heart";


    const shapes=[

        "♡",
        "♥",
        "💕",
        "💗"

    ];


    heart.textContent =
    shapes[
        Math.floor(Math.random()*shapes.length)
    ];



    
    heart.style.left =
    Math.random()*100+"vw";



    
    heart.style.fontSize =
    (15+Math.random()*25)+"px";



    
    heart.style.animationDuration =
    (8+Math.random()*10)+"s";



    floating.appendChild(heart);



    
    setTimeout(()=>{

        heart.remove();

    },18000);


}




setInterval(createHeart,400);








const heart =
document.getElementById("heart");


const text="I LOVE YOU";


const points=[];




for(let t=0;t<=Math.PI*2;t+=0.07){


    const x =
    16*Math.pow(Math.sin(t),3);



    const y =
    13*Math.cos(t)
    -5*Math.cos(2*t)
    -2*Math.cos(3*t)
    -Math.cos(4*t);



    points.push({

        x:350+x*15,

        y:320-y*15

    });

}





points.forEach((p,i)=>{


    setTimeout(()=>{


        const span =
        document.createElement("span");


        span.className="word";


        span.textContent=text;



        span.style.left =
        p.x+"px";


        span.style.top =
        p.y+"px";



        const next =
        points[(i+1)%points.length];



        const angle =
        Math.atan2(
            next.y-p.y,
            next.x-p.x
        )*180/Math.PI;



        span.style.transform =
        `translate(-50%,-50%)
         rotate(${angle}deg)`;



        heart.appendChild(span);



    }, i*100);


});


</script>


</body>
</html>
